      kind: mcp-server
      ordId: customer.build:apiResource:sap-role-optimization-6f66f.sap-s4-business-role-mcp-server:v1

requires:
  - name: CE_BUSINESSROLE_0001
    kind: api
    ordId: sap.s4:apiResource:CE_BUSINESSROLE_0001:v1
